interface:
  display_name: "ru"
  short_description: "Русский текст: норма языка и редактура"
  default_prompt: "Используй $ru для русского текста: сначала факты и источники, потом состав и композиция, потом язык и знаки. Сохраняй числа, отрицание, причинность, статус, уверенность, код, цитаты и выбранные термины. Объём правки задаёт просьба. Оценки тексту и вердикта об авторстве не давай."
policy:
  allow_implicit_invocation: true
