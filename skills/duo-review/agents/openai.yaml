interface:
  display_name: "Duo: ревью сделанного"
  short_description: "Ревью в том же треде, что и план, до трёх раундов"
  default_prompt: "Используй $duo-review, чтобы отдать сделанную работу Codex на ревью в постоянном треде."
policy:
  # Codex keeps these two to an explicit $duo-design or $duo-review. They are how
  # Claude consults Codex; picked by Codex on its own, they would have it open a
  # thread to review itself. Codex defaults this to true, so leaving it out is
  # not the same as leaving it alone.
  allow_implicit_invocation: false
